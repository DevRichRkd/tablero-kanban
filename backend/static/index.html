<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero Kanban - Hola Mundo</title>
  <style>
    :root {
      --accent-yellow: #ecad0a;
      --primary-blue: #209dd7;
      --secondary-purple: #753991;
      --navy-dark: #032147;
      --gray-text: #888888;
      --surface: #f7f8fb;
      --surface-strong: #ffffff;
      --stroke: rgba(3, 33, 71, 0.08);
      --shadow: 0 18px 40px rgba(3, 33, 71, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--surface);
      color: var(--navy-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface-strong);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 40px;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--stroke);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--navy-dark);
      margin-bottom: 20px;
    }
    .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-yellow);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--navy-dark);
      margin-bottom: 12px;
    }
    p {
      color: var(--gray-text);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-box {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-text);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-blue);
    }
    button {
      background: var(--secondary-purple);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
      width: 100%;
    }
    button:hover {
      opacity: 0.9;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #032147;
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">
      <span class="tag-dot"></span>
      Parte 2: Verificacion de Estructura
    </div>
    <h1>Hola Mundo - Tablero Kanban</h1>
    <p>Este archivo HTML estatico confirma que el servidor FastAPI esta sirviendo contenido estatico correctamente en la ruta raiz.</p>
    
    <div class="status-box">
      <div class="status-label">Estado de la ruta estatica</div>
      <div class="status-value">HTML cargado exitosamente desde FastAPI</div>
    </div>

    <button id="btn-check" onclick="checkApi()">Probar llamada a la API (/api/health)</button>
    <pre id="result" class="result"></pre>
  </div>

  <script>
    async function checkApi() {
      const btn = document.getElementById('btn-check');
      const resEl = document.getElementById('result');
      btn.textContent = 'Consultando API...';
      try {
        const response = await fetch('/api/health');
        const data = await response.json();
        resEl.style.display = 'block';
        resEl.textContent = JSON.stringify(data, null, 2);
        btn.textContent = 'Llamada exitosa';
      } catch (err) {
        resEl.style.display = 'block';
        resEl.textContent = 'Error al consultar la API: ' + err.message;
        btn.textContent = 'Reintentar llamada';
      }
    }
  </script>
</body>
</html>
